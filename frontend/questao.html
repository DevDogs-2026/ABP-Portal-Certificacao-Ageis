<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="shortcut icon" href="./src/images/icons/devschool.ico" type="image/x-icon">
    <link rel="stylesheet" href="src/css/questao.css">

    <style>
        /* Feedback compacto e legível, preservando as cores atuais do DogSchool */
        .feedback-dialog.continuar__pausar_div,
        .feedback-dialog.limite__tempo_div {
            width: min(92vw, 760px);
            min-height: 0;
            max-height: calc(100vh - 32px);
            top: 50%;
            left: 50%;
            right: auto;
            bottom: auto;
            transform: translate(-50%, -50%);
            padding: clamp(24px, 4vw, 44px);
            gap: 26px;
            overflow-y: auto;
            box-sizing: border-box;
            box-shadow: 0 24px 70px rgba(0, 0, 0, .22);
        }
        .feedback-dialog .feedback-titulo {
            color: #fff;
            font-size: clamp(1.5rem, 2.2vw, 2rem);
            line-height: 1.25;
            text-align: center;
            margin: 0 0 16px;
        }
        .feedback-dialog .cont__paus_text,
        .feedback-dialog .limite_tempo_text {
            color: #fff;
            font-size: clamp(1rem, 1.4vw, 1.25rem);
            line-height: 1.6;
            text-align: center;
            overflow-wrap: anywhere;
        }
        .feedback-dialog .feedback-orientacao {
            color: rgba(255, 255, 255, .9);
            font-size: clamp(.9rem, 1.1vw, 1rem);
            line-height: 1.5;
            text-align: center;
            margin-top: 16px;
        }
        #cont-pausa > .feedback-acoes,
        #limite-tempo > .feedback-acoes {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 16px;
            width: 100%;
            flex-wrap: wrap;
        }
        .feedback-dialog .cont__paus_btn,
        .feedback-dialog .limite_tempo_btn {
            width: auto;
            min-width: 170px;
            max-width: 100%;
            height: auto;
            min-height: 54px;
            padding: 12px 20px;
            font-size: clamp(1rem, 1.3vw, 1.2rem);
            line-height: 1.3;
        }
        @media (max-width: 520px) {
            .feedback-dialog.continuar__pausar_div,
            .feedback-dialog.limite__tempo_div { gap: 20px; }
            #cont-pausa > .feedback-acoes,
            #limite-tempo > .feedback-acoes { flex-direction: column; }
            .feedback-dialog .cont__paus_btn,
            .feedback-dialog .limite_tempo_btn { width: 100%; }
        }
    </style>
    <script src="./src/js/api.js"></script>
    <script src="./src/js/guarda.js"></script>
    <title>Questão</title>
</head>
<body class="body">
    <header class="header" id="header">
        <div class="header__tema">
            <p class="header__tema_p">Tema <span class="header__tema_span" id="tema"></span> de 12</p>
        </div>
        <div class="header__tempo">
            <p class="header__tempo_p">Tempo: </p>
            <span class="header__tempo_span" id="tempo"></span>
        </div>
    </header>
    <main class="main" id="main">
        <section class="main__questao">
            <div class="main__questao_enunciado">
                <p class="main__questao_texto" id="questao-texto" aria-live="polite">
                    Carregando questão...
                </p>
            </div>
            <div class="main__questao_imagem">
                <img src="" alt="" class="main__questao_img" hidden>
            </div>
        </section>
        <section class="main__alternativas">
            <div class="main__alternativa_div" id="alternativa-a">
                <p class="main__alternativa"></p>
                <p class="main__alternativa_texto"></p>
            </div>
            <div class="main__alternativa_div" id="alternativa-b">
                <p class="main__alternativa"></p>
                <p class="main__alternativa_texto"></p>
            </div>
            <div class="main__alternativa_div" id="alternativa-c">
                <p class="main__alternativa"></p>
                <p class="main__alternativa_texto"></p>
            </div>
            <div class="main__alternativa_div" id="alternativa-d">
                <p class="main__alternativa"></p>
                <p class="main__alternativa_texto"></p>
            </div>
        </section>
        <div class="main__botao_off"  id="btn-confirma">
            <button class="main__btn" type="button" disabled>Confirmar</button>
        </div>
        <p id="erro-avaliacao" role="alert" hidden></p>
    </main>
    <div class="limite__tempo_div_off feedback-dialog" id="limite-tempo"
         role="dialog" aria-modal="true" aria-labelledby="limite-tempo-titulo">
        <div>
            <h2 class="feedback-titulo" id="limite-tempo-titulo">Tempo esgotado</h2>
            <p class="limite_tempo_text" id="limite-tempo-mensagem"></p>
            <p class="feedback-orientacao" id="limite-tempo-orientacao"></p>
        </div>
        <div class="feedback-acoes">
            <button class="limite_tempo_btn" id="proxima-questao-tempo" type="button">Próxima questão</button>
            <button class="limite_tempo_btn" id="pausar-certificado-tempo" type="button">Ver progresso</button>
        </div>
    </div>

    <div class="continuar__pausar_div_off feedback-dialog" id="cont-pausa"
         role="dialog" aria-modal="true" aria-labelledby="cont-pausa-titulo">
        <div>
            <h2 class="feedback-titulo" id="cont-pausa-titulo">Resposta registrada</h2>
            <p class="cont__paus_text" id="cont-pausa-mensagem"></p>
            <p class="feedback-orientacao" id="cont-pausa-orientacao"></p>
        </div>
        <div class="feedback-acoes">
            <button class="cont__paus_btn" id="proxima-questao" type="button">Próxima questão</button>
            <button class="cont__paus_btn" id="pausar-certificado" type="button">Ver progresso</button>
        </div>
    </div>
    <script src="./src/js/questao.js"></script>
</body>
</html>
