<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="shortcut icon" href="./src/images/icons/dogschool.ico" type="image/x-icon">
    <link rel="stylesheet" href="src/css/questao.css">
    <script src="./src/js/guarda.js"></script>
    <title>Questão</title>
</head>
<body class="body">
    <header class="header" id="header">
        <div class="header__tema">
            <p class="header__tema_p">Tema <span class="header__tema_span" id="tema"></span> de 12</p>
        </div>
        <div class="header__tempo">
            <p class="header__tempo_p">Tempo: </p>
            <span class="header__tempo_span" id="tempo"></span>
        </div>
    </header>
    <main class="main" id="main">
        <section class="main__questao">
            <div class="main__questao_enunciado">
                <p class="main__questao_texto" id="questao-texto"></p>
            </div>
            <div class="main__questao_imagem">
                <img src="" alt="" class="main__questao_img">
            </div>
        </section>
        <section class="main__alternativas">
            <div class="main__alternativa_div" id="alternativa-a">
                <p class="main__alternativa"></p>
                <p class="main__alternativa_texto"></p>
            </div>
            <div class="main__alternativa_div" id="alternativa-b">
                <p class="main__alternativa"></p>
                <p class="main__alternativa_texto"></p>
            </div>
            <div class="main__alternativa_div" id="alternativa-c">
                <p class="main__alternativa"></p>
                <p class="main__alternativa_texto"></p>
            </div>
            <div class="main__alternativa_div" id="alternativa-d">
                <p class="main__alternativa"></p>
                <p class="main__alternativa_texto"></p>
            </div>
        </section>
        <div class="main__botao_off"  id="btn-confirma">
            <button class="main__btn">Confirmar</button>
        </div>
    </main>
    <div class="limite__tempo_div_off" id="limite-tempo">
        <div>
            <p class="limite_tempo_text">Acabou o Tempo!!!</p>
        </div>
        <div>
            <button class="limite_tempo_btn" id="proxima-questao">Continuar</button>
            <a href="index.html"><button class="limite_tempo_btn" id="pausar-certificado">Pausar</button></a>
        </div>
    </div>
    <div class="continuar__pausar_div_off" id="cont-pausa">
        <div>
            <p class="cont__paus_text">Clique no botão <span>Continuar</span> para ir ao próximo tema</p>
            <p class="cont__paus_text">Ou</p>
            <p class="cont__paus_text">Clique no botão <span>Pausar</span> para pausar e sair da certificação</p>
        </div>
        <div>
            <button class="cont__paus_btn" id="proxima-questao">Continuar</button>
            <a href="index.html"><button class="cont__paus_btn" id="pausar-certificado">Pausar</button></a>
        </div>
    </div>
    <script src="./src/js/questao.js"></script>
</body>
</html>
