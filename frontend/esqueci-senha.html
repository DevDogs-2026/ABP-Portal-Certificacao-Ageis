<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Metodologia Ágil</title>
    <link rel="stylesheet" href="src/css/esqueci-senha.css"/>
    <link rel="stylesheet" href="src/css/visual-refresh.css"/>
    <meta name="description" content="DogSchool: estude Metodologia Ágil e Scrum, faça a avaliação e conquiste seus certificados.">
</head>
<body>
    <div class="container" id="container">

        <!-- Esqueci minha sinha box -->

        <div class="form-container">
            <form id="forgotform" method="post">
                
                <h1 class="title">Esqueci minha senha</h1>

                <div class="input-icon">
                    <img src="src/images/icons/cpf-icon.svg" alt="" aria-hidden="true">
                    <label for="redefinir-senha" class="sr-only">Email</label>
                    <input type="email" name="email" placeholder="Email" autocomplete="email" required>
                </div>

                <div class="input-icon">
                    <img src="src/images/icons/lock-icon.svg" alt="" aria-hidden="true">
                    <label for="redefinir-senha" class="sr-only">Senha</label>
                    <input type="password" name="senha" placeholder="Nova senha" minlength="6" autocomplete="new-password" required>
                </div>


                <div class="input-icon">
                    <img src="src/images/icons/lock-icon.svg" alt="" aria-hidden="true">
                    <label for="redefinir-senha" class="sr-only">Senha</label>
                    <input type="password" name="confirmacaoSenha" placeholder="Confirme a nova senha" minlength="6" autocomplete="new-password" required>
                </div>

                <button type="submit">Redefinir</button>
            </form>
        </div>
                <a href="acesso.html" class="button-voltar"><img src="src/images/icons/seta-icon.png" class="icone-voltar" alt="Voltar">Voltar</a>
    </div>
    <script src="src/js/esqueci-senha.js"></script>
</body>
</html>
