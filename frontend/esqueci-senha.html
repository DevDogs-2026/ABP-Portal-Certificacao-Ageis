<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <link rel="shortcut icon" href="./src/images/icons/dogschool.ico" type="image/x-icon">
  <link rel="stylesheet" href="src/css/esqueci-senha.css">
  <title>Recuperar senha | DogSchool</title>
</head>
<body>
  <div class="container recovery">
    <nav class="btn-home"><a class="button-voltar" href="acesso.html">← Voltar ao login</a></nav>
    <div class="form-container">
      <form id="forgotform" autocomplete="on">
        <h1 class="title">Recuperar senha</h1>
        <p class="ajuda">Informe o e-mail cadastrado no DogSchool. Enviaremos um link de uso único, válido por 15 minutos.</p>
        <label class="sr-only" for="recuperar-email">E-mail cadastrado</label>
        <input id="recuperar-email" type="email" name="email" placeholder="Seu e-mail cadastrado" autocomplete="email" maxlength="255" required>
        <button type="submit">Enviar link</button>
        <p id="aviso-recuperacao" class="aviso" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div>
  <script src="src/js/api.js"></script>
  <script src="src/js/esqueci-senha.js"></script>
</body>
</html>
