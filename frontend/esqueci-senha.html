<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="DogSchool: estude Metodologia Ágil e Scrum, faça a avaliação e conquiste seus certificados.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="shortcut icon" href="./src/images/icons/dogschool.ico" type="image/x-icon">
    <link rel="stylesheet" href="src/css/esqueci-senha.css"/>
    <title>Esqueci - Senha</title>
</head>
<body>
    <div class="container" id="container">

        <nav class="btn-home">
            <a href="acesso.html" class="button-voltar"><i class="icone-voltar fa-solid fa-angle-left"></i>Voltar</a>
        </nav>
        <!-- Esqueci minha sinha box -->

        <div class="form-container">
            <form id="forgotform" method="post">
                
                <h1 class="title">Esqueci minha senha</h1>

                <div class="input-icon">
                    <i class="fa-regular fa-address-card"></i>
                    <label for="redefinir-senha" class="sr-only">Email</label>
                    <input type="email" name="email" placeholder="Email" autocomplete="email" required>
                </div>

                <div class="input-icon">
                    <i class="fa-solid fa-unlock-keyhole"></i>
                    <label for="redefinir-senha" class="sr-only">Senha</label>
                    <input type="password" name="senha" placeholder="Nova senha" minlength="6" autocomplete="new-password" required>
                </div>


                <div class="input-icon">
                    <i class="fa-solid fa-unlock-keyhole"></i>
                    <label for="redefinir-senha" class="sr-only">Senha</label>
                    <input type="password" name="confirmacaoSenha" placeholder="Confirme a nova senha" minlength="6" autocomplete="new-password" required>
                </div>

                <button type="submit">Redefinir</button>
            </form>
        </div>
    </div>
    <script src="src/js/esqueci-senha.js"></script>
</body>
</html>
