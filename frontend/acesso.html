<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Metodologia Ágil</title>
    <link rel="stylesheet" href="src/css/acesso.css"/>
    <meta name="description" content="DogSchool: estude Metodologia Ágil e Scrum, faça a avaliação e conquiste seus certificados.">
</head>
<body>
    <div class="container" id="container">
        
        <nav class="btn-home">
            <a href="index.html" class="button-voltar"><img src="src/images/icons/seta-icon.png" class="icone-voltar" alt="Home">Home</a>
        </nav>

        <!-- Cadastro -->
        <div class="form-container sign-up" aria-label="Menu de cadastro">
            <form id="signupForm" method="post">
                <h1 class="form-title">Criar Conta</h1>
                <div class="input-icon">
                    <img src="src/images/icons/profile-icon.svg" alt="icone-profile" aria-hidden="true">
                    <label for="cad-nome" class="sr-only">Nome completo</label>
                    <input type="text" id="cad-nome" name="nome" placeholder="Nome Completo" autocomplete="name" required>
                </div>
                    <div class="input-icon">
                        <img src="src/images/icons/mail-icon.svg" alt="icone-email" aria-hidden="true">
                        <label for="cad-email" class="sr-only">E-mail</label>
                        <input type="email" id="cad-email" name="email" placeholder="Email" autocomplete="email" required>
                    </div>
                    <div class="input-icon">
                        <img src="src/images/icons/cpf-icon.svg" alt="icone-card" aria-hidden="true">
                        <label for="cad-cpf" class="sr-only">CPF</label>
                        <input type="text" id="cad-cpf" name="cpf" placeholder="CPF" inputmode="numeric" required>
                    </div>
                    <div class="input-icon">
                        <img src="src/images/icons/lock-icon.svg" alt="icone-cadeado" aria-hidden="true">
                        <label for="cad-senha" class="sr-only">Senha</label>
                        <input type="password" id="cad-senha" name="senha" placeholder="Senha" autocomplete="new-password" required>
                    </div>
                <button type="submit">Cadastrar</button>
            </form>
        </div>

        <!-- Login -->
        <div class="form-container sign-in" aria-label="Menu de cadastro">
            <form id="loginForm" method="post">
                <h1 class="form-title">Entrar na Conta</h1>
                <div class="input-icon">
                    <img src="src/images/icons/cpf-icon.svg" alt="icone-card" aria-hidden="true">
                    <label for="login-cpf" class="sr-only">CPF</label>
                    <input type="text" id="login-cpf" name="cpf" placeholder="CPF" inputmode="numeric" required>
                </div>
                <div class="input-icon">
                    <img src="src/images/icons/lock-icon.svg" alt="icone-cadeado" aria-hidden="true">
                    <label for="login-senha" class="sr-only">Senha</label>
                    <input type="password" id="login-senha" name="senha" placeholder="Senha" autocomplete="current-password" required>
                </div>
                <a href="esqueci-senha.html" class="forgot">Esqueci Minha Senha</a>
                <button type="submit">Entrar</button>
            </form>
        </div>

        <!-- Painel de alternância -->
        <div class="toggle-container" aria-label="Barreira de divise">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1>Bem-vindo de volta!</h1>
                    <p><br>Entre com seus dados para acessar todo o conteúdo</p>
                    <button class="hidden" id="login">Entrar</button>
                </div>
                <div class="toggle-panel toggle-right" aria-label="Barreira de divise">
                    <h1>Olá! <br> Seja bem-vindo!</h1>
                    <p><br>Registre seus dados para acessar todo o conteúdo</p>
                    <button class="hidden" id="register">Cadastrar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="src/js/acesso.js"></script>
</body>
</html>
